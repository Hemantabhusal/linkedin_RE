[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-profile-scraper-python"
version = "0.1.0"
description = "Modular Python LinkedIn profile scraper worker"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Hemanta" }
]
dependencies = [
  "curl_cffi>=0.7.4",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "mysql-connector-python>=9.0,<10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
